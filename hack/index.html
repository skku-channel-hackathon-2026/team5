<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!--
  mate · 수정 가이드 (파일 하나로 되어 있어요. 더블클릭하면 브라우저에서 바로 열려요)
  1) <style> 맨 위 :root        → 색 · 글꼴 (--pri = 대표 초록색, 다크모드 색은 아래쪽 블록)
  2) <script> 맨 위 (데이터)    → APP_NAME(앱 이름), OPPS(추천 소식 + url 링크), 일정 예시(initialEvents), 종류(BASE_TYPES)
  3) <script> 중간 (화면 함수)   → calScreen(달력), recoScreen(추천), mealScreen(밥약), meetScreen(과팅), playScreen(놀기)
  4) <script> 아래 (동작 ACT)   → 버튼을 눌렀을 때 일어나는 일. data-act="이름" 버튼은 ACT.이름() 이 실행돼요
  5) 글자만 바꾸고 싶으면 Ctrl/Cmd+F 로 검색해서 그 부분만 고치면 돼요
-->
<title>mate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#E9EFEB; --paper:#F7F9F7; --surface:#FFFFFF; --ink:#15201B; --mut:#55625B; --line:#DCE4DF; --seg:#E7EDE9;
  --pri:#1F6B4A; --pri-ink:#FFFFFF; --pri-soft:#E2F1E9; --pri-line:#BFDCCB; --pri-text:#17472F;
  --feat-bg:#17472F; --feat-ink:#FFFFFF; --feat-mut:#CDE5D7; --feat-btn:#FFFFFF; --feat-btn-ink:#17472F;
  --hero-bg:#FBEBD0; --hero-ink:#4A3208; --hero-mut:#6E5320;
  --c-class:#2F62D6; --c-class-bg:#E5ECFB; --c-class-ink:#1D3F94;

  --c-job:#B7791F;   --c-job-bg:#FAEFD7;   --c-job-ink:#6B4A0F;
  --c-meet:#8A47B8;  --c-meet-bg:#F0E6F8;  --c-meet-ink:#5C2A80;
  --c-dept:#4B5563;  --c-dept-bg:#E9ECEF;  --c-dept-ink:#333B47;
  --c-opp:#1F6B4A;   --c-opp-bg:#E2F1E9;   --c-opp-ink:#17472F;
    --c-p0:#0E8A8A; --c-p0-bg:#DDF1F1; --c-p0-ink:#0B5C5C;
    --c-p1:#C2457D; --c-p1-bg:#FBE4EE; --c-p1-ink:#862A55;
    --c-p2:#6E8B1F; --c-p2-bg:#EDF3D9; --c-p2-ink:#465A0F;
    --c-p3:#5B4BD6; --c-p3-bg:#E9E6FB; --c-p3-ink:#3B2E96;
    --c-p4:#D9601F; --c-p4-bg:#FCE9DC; --c-p4-ink:#8F3E0F;
    --c-p5:#2A8FBF; --c-p5-bg:#DFF0F8; --c-p5-ink:#17607F;
  --danger:#B4381F; --bezel:#1B2420; --shadow:0 24px 60px rgba(20,40,30,.22);
  --lock:#123B2A; --scrim:rgba(10,20,15,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F0C; --paper:#101713; --surface:#18211B; --ink:#E8F0EB; --mut:#9DABA4; --line:#26332B; --seg:#212D25;
    --pri:#56C795; --pri-ink:#062015; --pri-soft:#1B3327; --pri-line:#2C5A44; --pri-text:#BFE8D3;
    --feat-bg:#1D4A34; --feat-ink:#F2FAF5; --feat-mut:#B5D3C2; --feat-btn:#E8F0EB; --feat-btn-ink:#0F2A1D;
    --hero-bg:#3A2E14; --hero-ink:#F8E7C4; --hero-mut:#D8BF8A;
    --c-class:#7AA2FF; --c-class-bg:#1A2540; --c-class-ink:#B7CBFF;
    --c-assign:#F08A72; --c-assign-bg:#3A1F19; --c-assign-ink:#FFC0B0;
    --c-job:#E4B25A;   --c-job-bg:#3A2E14;   --c-job-ink:#F6D89B;
    --c-meet:#C79BEA;  --c-meet-bg:#2C1F3A;  --c-meet-ink:#E3C8F7;
    --c-dept:#A8B2BD;  --c-dept-bg:#232A30;  --c-dept-ink:#CDD5DC;
    --c-opp:#56C795;   --c-opp-bg:#1B3327;   --c-opp-ink:#BFE8D3;
    --c-p0:#5CCFCF; --c-p0-bg:#163333; --c-p0-ink:#B5EBEB;
    --c-p1:#F08DB8; --c-p1-bg:#3A1B29; --c-p1-ink:#FAC3DC;
    --c-p2:#B4D35A; --c-p2-bg:#29300F; --c-p2-ink:#D9EBA3;
    --c-p3:#A79BFF; --c-p3-bg:#24204A; --c-p3-ink:#D0CAFF;
    --c-p4:#FFA46B; --c-p4-bg:#3B2314; --c-p4-ink:#FFCFAE;
    --c-p5:#6CC3EE; --c-p5-bg:#15303D; --c-p5-ink:#B5E2F7;

  }
}
:root[data-theme="dark"]{
  --bg:#0A0F0C; --paper:#101713; --surface:#18211B; --ink:#E8F0EB; --mut:#9DABA4; --line:#26332B; --seg:#212D25;
  --pri:#56C795; --pri-ink:#062015; --pri-soft:#1B3327; --pri-line:#2C5A44; --pri-text:#BFE8D3;
  --feat-bg:#1D4A34; --feat-ink:#F2FAF5; --feat-mut:#B5D3C2; --feat-btn:#E8F0EB; --feat-btn-ink:#0F2A1D;
  --hero-bg:#3A2E14; --hero-ink:#F8E7C4; --hero-mut:#D8BF8A;
  --c-class:#7AA2FF; --c-class-bg:#1A2540; --c-class-ink:#B7CBFF;
  --c-assign:#F08A72; --c-assign-bg:#3A1F19; --c-assign-ink:#FFC0B0;
  --c-job:#E4B25A;   --c-job-bg:#3A2E14;   --c-job-ink:#F6D89B;
  --c-meet:#C79BEA;  --c-meet-bg:#2C1F3A;  --c-meet-ink:#E3C8F7;
  --c-dept:#A8B2BD;  --c-dept-bg:#232A30;  --c-dept-ink:#CDD5DC;
  --c-opp:#56C795;   --c-opp-bg:#1B3327;   --c-opp-ink:#BFE8D3;
    --c-p0:#5CCFCF; --c-p0-bg:#163333; --c-p0-ink:#B5EBEB;
    --c-p1:#F08DB8; --c-p1-bg:#3A1B29; --c-p1-ink:#FAC3DC;
    --c-p2:#B4D35A; --c-p2-bg:#29300F; --c-p2-ink:#D9EBA3;
    --c-p3:#A79BFF; --c-p3-bg:#24204A; --c-p3-ink:#D0CAFF;
    --c-p4:#FFA46B; --c-p4-bg:#3B2314; --c-p4-ink:#FFCFAE;
    --c-p5:#6CC3EE; --c-p5-bg:#15303D; --c-p5-ink:#B5E2F7;
  --danger:#F08A72; --bezel:#26332B; --shadow:0 24px 60px rgba(0,0,0,.6);
  --lock:#0B241A; --scrim:rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.disp{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
.t-class{--c:var(--c-class);--cb:var(--c-class-bg);--ci:var(--c-class-ink)}
.t-assign{--c:var(--c-assign);--cb:var(--c-assign-bg);--ci:var(--c-assign-ink)}
.t-job{--c:var(--c-job);--cb:var(--c-job-bg);--ci:var(--c-job-ink)}
.t-meet{--c:var(--c-meet);--cb:var(--c-meet-bg);--ci:var(--c-meet-ink)}
.t-dept{--c:var(--c-dept);--cb:var(--c-dept-bg);--ci:var(--c-dept-ink)}
.t-opp{--c:var(--c-opp);--cb:var(--c-opp-bg);--ci:var(--c-opp-ink)}
.t-p0{--c:var(--c-p0);--cb:var(--c-p0-bg);--ci:var(--c-p0-ink)}
.t-p1{--c:var(--c-p1);--cb:var(--c-p1-bg);--ci:var(--c-p1-ink)}
.t-p2{--c:var(--c-p2);--cb:var(--c-p2-bg);--ci:var(--c-p2-ink)}
.t-p3{--c:var(--c-p3);--cb:var(--c-p3-bg);--ci:var(--c-p3-ink)}
.t-p4{--c:var(--c-p4);--cb:var(--c-p4-bg);--ci:var(--c-p4-ink)}
.t-p5{--c:var(--c-p5);--cb:var(--c-p5-bg);--ci:var(--c-p5-ink)}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding-inline:24px;padding-block:24px}
.guide{width:340px;flex:none;display:flex;flex-direction:column;gap:20px}
.g-brand{display:flex;align-items:center;gap:12px}
.g-logo{width:44px;height:44px;border-radius:14px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.g-name{font-size:30px;line-height:1.1}
.g-tag{margin:0;color:var(--mut);font-size:15px;line-height:1.55;text-wrap:balance}
.g-h{margin:0;font-size:12px;letter-spacing:.08em;color:var(--mut);font-weight:700}
.g-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.g-item{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px 12px;border:1px solid transparent;border-radius:14px;background:transparent}
.g-item:hover{background:var(--surface)}
.g-item[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.g-n{flex:none;width:24px;height:24px;border-radius:12px;background:var(--seg);color:var(--mut);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.g-item[aria-current="true"] .g-n{background:var(--pri);color:var(--pri-ink)}
.g-t{display:block;font-weight:700;font-size:14px}
.g-d{display:block;color:var(--mut);font-size:12px;line-height:1.5}
.g-note{margin:0;font-size:12px;color:var(--mut);line-height:1.6}

.phone{position:relative;flex:none;width:402px;height:min(860px,100%);border:8px solid var(--bezel);border-radius:46px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;position:relative}

@media (max-width:900px){
  .guide{display:none}
  .stage{padding:0}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}

/* ---------- app chrome ---------- */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 6px}
.hd-l,.hd-r{display:flex;align-items:center;gap:8px;min-width:0}
.hd-title{font-size:26px;line-height:1.2}
.month{font-size:34px;line-height:1.1}
.month small{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--mut);margin-left:6px}
.ib{position:relative;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ib .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:5px;background:var(--c-assign);border:2px solid var(--surface)}
.back{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0;border-radius:22px;margin-left:-8px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*,.sheet>*{flex-shrink:0}
.tabbar{flex:none;display:flex;gap:4px;padding:8px 12px 12px;background:var(--surface);border-top:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--mut);padding:0}
.tab i{width:60px;height:32px;border-radius:16px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--pri);font-weight:700}
.tab[aria-current="page"] i{background:var(--pri-soft)}
.cta{flex:none;padding:10px 16px 12px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}

/* ---------- controls ---------- */
.btn{height:52px;border-radius:16px;border:1px solid transparent;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.soft{background:var(--pri-soft);color:var(--pri-text)}
.btn.line{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sm{height:44px;font-size:14px;border-radius:14px;width:auto;flex:none}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:transparent;color:var(--mut);height:44px;font-size:13px;padding:0 8px}
.link b{color:var(--pri);font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--seg)}
.seg button{flex:1;height:40px;border:0;border-radius:12px;background:transparent;color:var(--mut);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.chip .tdot{flex:none;width:8px;height:8px;border-radius:4px;background:var(--c)}
.chip.sug{min-height:36px;padding:0 12px;border-radius:18px;font-size:13px;color:var(--mut)}
.big .quote{margin-top:6px;color:var(--ink);font-weight:500}
.wheels{display:flex;gap:4px;padding:10px 8px 8px;align-items:stretch}
.wh-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.wh-col.wide{flex:1.35}
.wh-l{text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.wh-box{position:relative;height:220px}
.wh-band{position:absolute;left:2px;right:2px;top:88px;height:44px;border-radius:12px;background:var(--pri-soft);border:1px solid var(--pri-line)}
.wheel{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;padding-block:88px;scrollbar-width:none;overscroll-behavior:contain;outline:none;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{box-shadow:0 0 0 2px var(--pri) inset;border-radius:12px}
.wh-i{height:44px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--mut);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;-webkit-user-select:none}
.wh-i.on{color:var(--pri-text);font-weight:700;font-size:18px}
.wh-dash{align-self:center;color:var(--mut);padding-top:16px}
.nowchip{align-self:flex-start;min-height:40px}
.wheels.off .wh-band{background:transparent;border-style:dashed}
.wheels.off .wh-i.on{color:var(--mut);font-weight:500;font-size:16px}
.chip.add{border-style:dashed;color:var(--pri-text);font-weight:700}
.chip.add[aria-expanded="true"]{background:var(--pri-soft);border-color:var(--pri)}
.newt{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.newt .input{flex:1;min-width:0}
.chips.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.chips.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.chip{min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-text);font-weight:700}
.fchips{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.fchip i{width:8px;height:8px;border-radius:4px;background:var(--c,var(--mut))}
.fchip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:700}
.fchip[aria-pressed="true"] i{background:var(--pri-ink)}
.switch{flex:none;width:52px;height:32px;border-radius:16px;border:0;background:#9AA69F;padding:3px;display:flex;align-items:center;justify-content:flex-start}
.switch::after{content:"";width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--pri);justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:700}
.lbl small{font-weight:400;color:var(--mut);margin-left:6px;font-size:12px}
.input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-size:15px}
textarea.input{resize:none;line-height:1.5}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{margin:0;font-size:16px}
.sec-h span{font-size:12px;color:var(--mut)}
.hint{margin:0;font-size:12px;line-height:1.55;color:var(--mut)}

/* ---------- cards & rows ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.plain{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--cb,var(--seg));color:var(--ci,var(--mut));white-space:nowrap}
.avatar{flex:none;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--cb);color:var(--ci)}
.avs{display:flex}
.avs .avatar{width:34px;height:34px;border:2px solid var(--surface);margin-left:-8px;font-size:13px}
.avs .avatar:first-child{margin-left:0}

.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px 1px;margin-inline:-13px}
.mo-h{text-align:center;font-size:12px;color:var(--mut);padding:2px 0 4px}
.mo-h.sat{color:var(--c-class)}
.mo-h.sun{color:var(--c-assign)}
.dc{min-width:0;min-height:80px;border-radius:10px;border:1.5px solid transparent;background:transparent;padding:4px 1px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left}
.dc.tall{min-height:136px}
.dc.on{background:var(--pri-soft);border-color:var(--pri)}
.dc.dim{cursor:default}
.dc-top{display:flex;align-items:center;justify-content:center;gap:2px;height:20px}
.dn{min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:500;padding:0 3px;font-variant-numeric:tabular-nums}
.dn.sat{color:var(--c-class)}
.dn.sun{color:var(--c-assign)}
.dn.today{background:var(--pri);color:var(--pri-ink);font-weight:700}
.dc.dim .dn{color:var(--mut);opacity:.55}
.more{font-style:normal;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ch{display:block;height:17px;line-height:17px;padding:0 1px 0 2px;border-radius:4px;border-left:2px solid var(--c);background:var(--cb);color:var(--ci);font-size:10px;letter-spacing:-.03em;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai{display:flex;gap:12px;align-items:flex-start;background:var(--pri-soft);border:1px solid var(--pri-line);border-radius:18px;padding:12px 14px}
.ai-ic{flex:none;width:34px;height:34px;border-radius:17px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.ai-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ai-lbl{font-size:12px;font-weight:700;color:var(--pri-text)}
.ai-msg{margin:2px 0 0;font-size:14px;line-height:1.5;color:var(--ink)}
.load{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.load.l0{background:var(--surface);color:var(--pri-text)}
.load.l1{background:var(--c-job-bg);color:var(--c-job-ink)}

const WH_H = 44;
const MEET_DATES = Array.from({ length: 9 }, (_, i) => '9-' + (22 + i));
const wheel = (k, items, sel, label, wide) => `<div class="wh-col${wide ? ' wide' : ''}"><span class="wh-l">${label}</span><div class="wh-box"><i class="wh-band"></i>
  <div class="wheel" role="listbox" tabindex="0" aria-label="${label}" data-wheel="${k}" data-sel="${Math.max(0, items.findIndex((x) => x[0] === sel))}">${items.map(([v, l]) => `<div class="wh-i${v === sel ? ' on' : ''}" role="option" aria-selected="${v === sel}" data-v="${v}">${l}</div>`).join('')}</div></div></div>`;
const meetSum = () => `${shortDate(S.meet.date)} ${S.meet.from}–${S.meet.to}에 가능한 팀을 찾아요`;
function meetTeams() {
  const m = S.meet, dur = hours(m.from, m.to);
  return [{ n: '경영학과 26학번 3명', from: m.from, to: m.to, ov: dur },
          { n: '심리학과 26학번 3명', from: fromMin(toMin(m.from) + 30), to: fromMin(toMin(m.to) + 30), ov: Math.max(0.5, dur - 0.5) }];
}
function meetScreen() {
  const m = S.meet, name = '과팅';

      ${teams.map((t, i) => `<article class="card sec t-meet"><div class="row"><div class="avs">${['김', '이', '박'].map((c, j) => `<span class="avatar" style="background:${['var(--c-meet-bg)', 'var(--c-class-bg)', 'var(--c-job-bg)'][j]};color:${['var(--c-meet-ink)', 'var(--c-class-ink)', 'var(--c-job-ink)'][j]}">${c}</span>`).join('')}</div><span class="pill" style="margin-left:auto">${t[2]}</span></div>
        <div><strong style="font-size:16px">${t[0]}</strong><div class="hint">${t[1]} · 3 : 3 ${name}</div></div>

    <section class="card safe"><span class="ai-ic">${I('shield', 18)}</span><div style="flex:1"><strong>만난 뒤에 불편했다면</strong><p class="hint" style="margin-top:2px">익명으로 경고를 보낼 수 있어요. 상대 팀에는 누가 보냈는지 알려지지 않아요.</p>
      <button class="btn line sm" style="margin-top:10px;width:100%" data-act="meetWarn"${m.warned ? ' disabled' : ''}>${m.warned ? '익명 경고를 보냈어요' : '익명 경고 보내기'}</button></div></section>
    <button class="btn line" data-act="push">${I('bell', 20)}받는 팀 화면 보기</button><button class="link" data-act="meetReset">처음으로</button></div>${tabbar()}`;
  const members = [['나', '소프트웨어학과 · 26학번', 'var(--pri-soft)', 'var(--pri-text)', '팀장'], ['이서윤', '소프트웨어학과 · 26학번', 'var(--c-meet-bg)', 'var(--c-meet-ink)', ''], ['박도현', '전자전기공학부 · 26학번', 'var(--c-class-bg)', 'var(--c-class-ink)', '']];
  return `${subHead('과팅')}<div class="scroll">
    <section class="sec"><div class="sec-h"><h2>우리 팀 3명</h2><span>학과·학번만 보여요</span></div>
      <div class="card" style="padding-block:4px">${members.map((p) => `<div class="person"><span class="avatar" style="background:${p[2]};color:${p[3]}">${p[0][0]}</span><div class="row-b"><strong>${p[0]}</strong><span>${p[1]}</span></div>${p[4] ? `<span class="ok">${p[4]}</span>` : `<span style="color:var(--pri)">${I('check', 20, 2.2)}</span>`}</div>`).join('')}</div></section>
    <section class="sec"><div class="sec-h"><h2>언제 가능해요?</h2><span>비슷한 시간대의 팀과 이어줘요</span></div>
      <div class="card wheels">${wheel('date', MEET_DATES.map((k) => [k, `${DAYN[dowOf(k)]} ${k.replace('-', '/')}`]), m.date, '날짜', true)}${wheel('from', timeOpts('09:00', '23:30').map((t) => [t, t]), m.from, '시작')}<span class="wh-dash" aria-hidden="true">~</span>${wheel('to', timeOpts('09:30', '24:00').map((t) => [t, t]), m.to, '끝')}</div>
      <p class="hint" id="meet-sum" style="text-align:center">${meetSum()}</p></section>
    <section class="card safe"><span class="ai-ic">${I('shield', 18)}</span><div style="flex:1"><strong>매너 지킴이</strong><p class="hint" style="margin-top:2px">무례한 상대는 익명으로 경고를 보낼 수 있어요. 경고가 3번 쌓이면 과팅이 몇 주간 정지돼요.</p>
      <div class="row" style="margin-top:10px"><div class="meter" style="flex:1"><i></i><i></i><i></i></div><span class="hint">내 경고 0 / 3</span></div></div></section>

/* ============ router & render ============ */
function screen() {
  if (S.onboard === 0) return verifyScreen();
  if (S.onboard === 1) return interestScreen();
  if (S.tab === 'reco') return recoScreen();
  if (S.tab === 'social') return socialScreen();
  return calScreen();
}
const screenKey = () => [S.onboard, S.tab, S.social, S.meal.step, S.meet.step, S.play.view, S.calView].join('|');
let lastKey = '';
const $phone = document.getElementById('phone');
function capture() { document.querySelectorAll('[data-bind]').forEach((el) => { S.form[el.dataset.bind] = el.value; }); }
function initWheels() { $phone.querySelectorAll('.wheel').forEach((w) => { w.scrollTop = Number(w.dataset.sel) * WH_H; }); }
function wheelTo(k, v) {
  const w = $phone.querySelector(`.wheel[data-wheel="${k}"]`); if (!w) return;
  const i = [...w.children].findIndex((n) => n.dataset.v === v); if (i >= 0) w.scrollTo({ top: i * WH_H, behavior: 'smooth' });
}
function wheelMark(w) {
  const items = w.children, i = Math.max(0, Math.min(items.length - 1, Math.round(w.scrollTop / WH_H)));
  [...items].forEach((n, j) => { n.classList.toggle('on', j === i); n.setAttribute('aria-selected', j === i); });
  return items[i].dataset.v;
}
function wheelCommit(w) {
  const k = w.dataset.wheel, v = wheelMark(w), user = w._u; w._u = false;
  if (k === 'mdate' || k === 'mclock') {
    const ml = S.meal; w.dataset.sel = [...w.children].findIndex((n) => n.dataset.v === v);
    if (k === 'mdate') ml.date = v; else ml.clock = v;
    if (user) {
      ml.time = ml.clock;
      const box = $phone.querySelector('.mealw'); if (box) box.classList.remove('off');
      const nb = document.getElementById('meal-now'); if (nb) nb.setAttribute('aria-pressed', 'false');
    }
    const cta = document.getElementById('meal-cta'); if (cta) cta.textContent = mealCta(ml);
    return;
  }
  const m = S.meet;
  m[k] = v; w.dataset.sel = [...w.children].findIndex((n) => n.dataset.v === v);
  if (k === 'from' && toMin(m.to) <= toMin(v)) { m.to = fromMin(Math.min(1440, toMin(v) + 60)); wheelTo('to', m.to); }
  if (k === 'to' && toMin(v) <= toMin(m.from)) { m.from = fromMin(Math.max(540, toMin(v) - 60)); wheelTo('from', m.from); }
  const sum = document.getElementById('meet-sum'); if (sum) sum.textContent = meetSum();
}
document.addEventListener('scroll', (e) => {
  const w = e.target;
  if (!w || !w.classList || !w.classList.contains('wheel')) return;
  wheelMark(w); clearTimeout(w._t); w._t = setTimeout(() => wheelCommit(w), 100);
}, true);
['pointerdown', 'wheel', 'touchstart'].forEach((ev) => document.addEventListener(ev, (e) => {
  const w = e.target.closest && e.target.closest('.wheel'); if (w) w._u = true;
}, { capture: true, passive: true }));
document.addEventListener('click', (e) => {
  const it = e.target.closest && e.target.closest('.wh-i'); if (!it) return;
  const w = it.parentElement, i = [...w.children].indexOf(it); w._u = true;
  if (i === Number(w.dataset.sel)) wheelCommit(w); else w.scrollTo({ top: i * WH_H, behavior: 'smooth' });
});
document.addEventListener('keydown', (e) => {
  const w = e.target;
  if (!w || !w.classList || !w.classList.contains('wheel') || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault(); w._u = true; w.scrollBy({ top: e.key === 'ArrowDown' ? WH_H : -WH_H, behavior: 'smooth' });
});
function render() {
  capture();
  const ae = document.activeElement, fid = ae && ae.id;
  const old = $phone.querySelector('.scroll'), top = old ? old.scrollTop : 0;
  const k = screenKey();
  $phone.innerHTML = `<div class="app">${screen()}</div>${overlays()}`;
  const sc = $phone.querySelector('.scroll');
  if (sc && k === lastKey) sc.scrollTop = top;
  lastKey = k; prevSheet = S.sheet; prevBanner = S.banner;
  initWheels();
  if (fid) { const n = document.getElementById(fid); if (n) n.focus(); }
  renderGuide();
}
function jumpActive(i) {
  if (S.push) return i === 6;
  if (S.onboard !== null) return i === 0;
  if (S.tab === 'cal') return i === 1;
  if (S.tab === 'reco') return i === 2;
  if (S.tab === 'social') return (i === 3 && S.social === 'meal') || (i === 4 && S.social === 'meeting') || (i === 5 && S.social === 'play');
  return false;
}
function renderGuide() {
  document.getElementById('guide').innerHTML = `<div class="g-brand"><span class="g-logo">${I('leaf', 24, 2)}</span><span class="disp g-name">${APP_NAME}</span></div>
    <p class="g-tag">새내기의 하루를 한 곳에서. 일정 · 기회 · 사람까지, 처음에 관심사만 고르면 나머지는 앱이 해요.</p>

/* ============ actions ============ */
const go = (tab, social) => { S.tab = tab; S.social = social || 'hub'; S.sheet = null; S.push = false; S.banner = null; };
const resetFlows = () => { S.meal = freshState().meal; S.meet = freshState().meet; S.play = freshState().play; };
const hours = (a, b) => { const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number); return Math.max(0, ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60); };
const fmtH = (h) => (Math.round(h * 2) / 2).toString().replace(/\.0$/, '');

const ACT = {
  tab(v) { go(v); S.onboard = null; if (v === 'social') resetFlows(); },
  view(v) { S.calView = v; if (v === 'week' && WEEK.map((d) => '9-' + d).indexOf(S.sel) < 0) S.sel = TODAY; },
  sel(v) { S.sel = v; },
  filter(v) { S.filter = v; },
  sheet(v) { S.sheet = v; if (v === 'add') { S.form.addDate = isoOf(S.sel); S.add.newOpen = false; } if (v === 'notif') S.unread = 0; },
  closeSheet() { S.sheet = null; },
  closeBanner() { S.banner = null; },
  bannerGo(v) { S.banner = null; if (v === 'cal') go('cal'); if (v === 'social') go('social'); },
  delEv(v) { S.events = S.events.filter((e) => e.id !== v); toast('일정을 지웠어요'); },
  cat(v) { S.cats[v] = !S.cats[v]; },
  opp(v) {
    const o = OPPS.find((x) => x.id === v);
    if (isAdded(v)) { S.events = S.events.filter((e) => e.id !== 'opp-' + v); toast('달력에서 뺐어요'); }
    else { S.events.push(oppEvent(o)); S.sel = o.key.startsWith('9-') ? o.key : S.sel; toast(`${shortDate(o.key)} 마감일을 달력에 추가했어요`); }
  },
  share(v) { S.share.o = v; S.sheet = 'share'; },
  shareTo(v) { S.share.to[v] = !S.share.to[v]; },
  shareSend() { const n = Object.values(S.share.to).filter(Boolean).length; S.sheet = null; toast(`${n}명에게 “같이 신청하자”를 보냈어요`); },
  social(v) {
    S.sheet = null; resetFlows();
    if (v === 'playNew') { S.social = 'play'; S.play.view = 'new'; } else S.social = v;
  },
  mealNow() { go('social', 'meal'); resetFlows(); S.meal.time = '지금'; },
  mealPick(v) { if (v === 'now') { S.meal.time = '지금'; S.meal.date = TODAY; } },
  mealSet(v) { const [k, x] = v.split('|'); S.meal[k] = x; },
  mealGrp(v) { S.meal.grp[v] = !S.meal.grp[v]; },
  mealAnon() { S.meal.anon = !S.meal.anon; },
  mealSend() {
    const m = S.meal;
    capture(); m.msg = (S.form.mealMsg || '').trim();
    if (m.mode === 'party') { m.step = 'posted'; return; }
    m.step = 'searching';
    setTimeout(() => {
      if (S.meal.step !== 'searching') return;
      S.meal.step = 'matched';
      banner({ t: 'job', ic: 'utensils', k: '밥약 매칭', title: '3명이 같이 먹기로 했어요!', body: `${mealAt(m)} · 김민준, 이서연, 박지훈${m.msg ? ' · “' + m.msg + '”' : ''}`, cta: '약속 확인', go: 'social' });
      notify({ ic: 'utensils', t: '밥약 매칭이 성사됐어요', s: '3명이 같이 먹기로 했어요', go: 'social' });
      render();
    }, 1500);
  },
  mealCal() {
    const m = S.meal, tm = tclock(m);
    addEvent({ key: m.date, t: tm, end: '', type: 'meet', title: '밥약', sub: m.msg ? '김민준 외 2명 · ' + m.msg : '김민준 외 2명', mine: true });
    toast('달력에 밥약을 추가했어요');
  },
  mealReset() { S.meal = freshState().meal; S.form.mealMsg = ''; },
  mealSug(v) { S.form.mealMsg = v; const n = document.getElementById('f-meal'); if (n) n.value = v; },
  reqWho(v) { S.req.who = v; },
  reqAnon() { S.req.anon = !S.req.anon; },
  reqSend() { S.sheet = null; toast('밥약 신청을 보냈어요. 답장이 오면 배너로 알려드려요'); },
  meetFind() {
    S.meet.step = 'searching';
    setTimeout(() => { if (S.meet.step === 'searching') { S.meet.step = 'found'; render(); } }, 1200);
  },
  meetAccept(v) {
    const name = '과팅', m = S.meet, t = meetTeams()[Number(v) || 0], when = `${shortDate(m.date)} ${t.from}–${t.to}`;
    m.step = 'matched'; m.win = { from: t.from, to: t.to };
    addEvent({ key: m.date, t: t.from, end: t.to, type: 'meet', title: name + ' 3 : 3', sub: t.n.split(' ')[0] + ' 팀과 함께', mine: true });
    banner({ t: 'meet', ic: 'heart', k: name + ' 매칭', title: '상대 팀과 이어졌어요', body: when + ' · 3 : 3', cta: '달력 보기', go: 'cal' });
    notify({ ic: 'heart', t: name + ' 매칭이 성사됐어요', s: when, go: 'cal' });
  },
  meetWarn() { S.meet.warned = true; toast('익명 경고를 보냈어요'); },
  meetReset() { S.meet = freshState().meet; },
  playJoin(v) {
    const x = PLAYS.find((p) => p.id === v);
    S.play.joined[v] = true;
    addEvent({ key: x.key || TODAY, t: x.time, end: x.end, type: 'meet', title: x.t, sub: '놀기 · 참여 확정', mine: true });
    banner({ t: 'class', ic: 'film', k: '놀기 매칭', title: '같이 갈 사람이 모였어요', body: `${x.when} · ${x.t}`, cta: '달력 보기', go: 'cal' });
  },
  playSet(v) { const [k, x] = v.split('|'); S.play.form[k] = k === 'anon' ? x === '1' : x; },
  playSubmit() {
    capture();
    const f = S.form;
    addEvent({ key: TODAY, t: f.playStart || '19:00', end: f.playEnd || '', type: 'meet', title: (f.playTitle || '').trim() || '오늘 영화 보러 갈 사람?', sub: '내가 올린 모임', mine: true });
    S.play.view = 'done'; f.playTitle = '';
  },
  addType(v) { S.add.type = v; },
  addNewToggle() {
    S.add.newOpen = !S.add.newOpen;
    if (S.add.newOpen) setTimeout(() => { const n = document.getElementById('f-newt'); if (n) n.focus(); }, 0);
  },
  addNewSubmit() {
    capture();
    const name = (S.form.addNew || '').trim(), norm = (x) => x.replace(/\s/g, '');
    if (!name) { toast('종류 이름을 적어주세요'); return; }
    if (filterList().some(([, l]) => norm(l) === norm(name))) { toast('이미 있는 종류예요'); return; }
    if (S.customTypes.length >= MAX_CUSTOM) { toast('종류는 6개까지 추가할 수 있어요'); return; }
    const id = 'x' + (uid++);
    S.customTypes.push({ id, name, p: S.customTypes.length % 6 });
    S.add.type = id; S.add.newOpen = false; S.form.addNew = '';
    const n = document.getElementById('f-newt'); if (n) n.value = '';
    toast(`'${name}' 종류를 추가했어요`);
  },
  addSubmit() {
    capture();
    const f = S.form, m = /^2026-09-(\d{2})$/.exec(f.addDate || ''), day = m ? Number(m[1]) : 0;
    if (day < 1 || day > 30) { toast('9월 안의 날짜를 입력해주세요'); return; }
    const key = '9-' + day, job = S.add.type === 'job', h = job ? (hours(f.addStart, f.addEnd) || 0) : 0;
    addEvent({ key, t: f.addStart || '18:00', end: f.addEnd, type: S.add.type, title: (f.addTitle || '').trim() || typeName(S.add.type),
      sub: job ? `${fmtH(h)}시간 · 직접 입력` : '직접 입력', mine: true, hours: job ? (h || 2) : undefined });
    S.sel = key; S.sheet = null; f.addTitle = '';
    const t = document.getElementById('f-title'); if (t) t.value = '';
    if (S.calView === 'week' && WEEK.map((d) => '9-' + d).indexOf(key) < 0) S.calView = 'month';
    toast('달력에 추가했어요');
  },
  conn(v) { S.conn[v] = !S.conn[v]; },
  jump(v) {
    const i = Number(v); S.sheet = null; S.push = false; S.banner = null; resetFlows();
    if (i === 0) { S.onboard = 0; S.verify = 'idle'; return; }
    S.onboard = null;
    if (i === 1) { go('cal'); S.calView = 'week'; S.sel = TODAY; S.filter = 'all'; }
    if (i === 2) go('reco');
    if (i === 3) { go('social', 'meal'); }
    if (i === 4) { go('social', 'meeting'); }
    if (i === 5) { go('social', 'play'); }
    if (i === 6) S.push = true;
  },
  resetAll() { const guide = S.onboard; S = freshState(); lastKey = ''; },
  push() { S.push = true; },
  pushNo() { S.push = false; },
  pushYes() {
    S.push = false; go('cal'); S.sel = TODAY;
    addEvent({ key: TODAY, t: '12:30', end: '13:00', type: 'meet', title: '밥약', sub: '익명의 새내기와', mine: true });
    banner({ t: 'job', ic: 'utensils', k: '밥약 확정', title: '12:30 밥약이 달력에 들어갔어요', body: '수락하면 서로 이름이 공개돼요', cta: '', go: '' });
  },
  notifGo(v) { S.sheet = null; if (v === 'reco') go('reco'); else if (v === 'push') S.push = true; else if (v === 'cal') go('cal'); else go('social'); },
  verifyShot() { S.verify = 'scanning'; setTimeout(() => { if (S.verify === 'scanning') { S.verify = 'done'; render(); } }, 900); },
  obNext() { S.onboard = 1; },
  obSkip() { S.onboard = null; go('cal'); },
  obCat(v) { S.cats[v] = !S.cats[v]; },
  obField(v) { S.fields[v] = !S.fields[v]; },
  obDone() { S.onboard = null; go('cal'); toast('끝났어요! 이제 앱이 알아서 소식을 모아요'); }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.classList.contains('scrim') && e.target !== el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { fn(el.dataset.v); render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter && ACT[e.target.dataset.enter]) { e.preventDefault(); ACT[e.target.dataset.enter](); render(); return; } if (e.key === 'Escape' && (S.sheet || S.push)) { S.sheet = null; S.push = false; render(); } });
render();
</script>
</body></html>
